name: Release image

# A version tag (v1.0.0, v1.2.3 …) publishes the Docker image that the
# docker-compose.yml pulls: ghcr.io/<owner>/within:<version> and :latest,
# for amd64 (PCs, NAS, Mac/Windows via Docker Desktop) and arm64
# (Raspberry Pi 4/5 and other 64-bit ARM boards).
#
# The package must be public on GitHub (Packages → within → Package settings →
# Change visibility) so that `docker compose up` works without a login.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image name (lowercase owner)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/within" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
